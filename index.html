<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Safiki Wheel</title>

    <!-- CSS -->
    <link rel="stylesheet" href="./wheel.css">
</head>

<body>

<div class="game-container">

    <!-- =========================
         💰 BALANCE SECTION
    ========================== -->
    <div class="balance-box">
        <span>Balance</span>
        <h2 id="balanceAmount">$1000.00</h2>
    </div>

    <!-- =========================
         🎰 WHEEL SECTION
    ========================== -->
    <div class="wheel-wrapper">

        <img id="pointer" class="pointer-img" src="./assets/pointer.png" alt="Pointer">

        <img id="wheel" class="wheel-img" src="./assets/wheel.png" alt="Wheel">

        <div class="wheel-center-hub">SAFIKI</div>
    </div>

    <!-- =========================
         🎯 SYMBOL TABLE
    ========================== -->
    <div class="symbol-table">

        <div class="symbol-box" data-symbol="heart">
            <img src="./assets/heart.png">
            <span>Heart</span>
        </div>

        <div class="symbol-box" data-symbol="diamond">
            <img src="./assets/diamond.png">
            <span>Diamond</span>
        </div>

        <div class="symbol-box" data-symbol="club">
            <img src="./assets/club.png">
            <span>Club</span>
        </div>

        <div class="symbol-box" data-symbol="spade">
            <img src="./assets/spade.png">
            <span>Spade</span>
        </div>

        <div class="symbol-box" data-symbol="crown">
            <img src="./assets/crown.png">
            <span>Crown</span>
        </div>

        <div class="symbol-box" data-symbol="flag">
            <img src="./assets/flag.png">
            <span>Flag</span>
        </div>

    </div>

    <!-- =========================
         🎮 SPIN BUTTON
    ========================== -->
    <div class="spin-section">
        <button id="spinBtn">
            <div class="wheel-icon"></div>
            <span class="btn-text">SPIN</span>
        </button>
    </div>

</div>

<!-- =========================
     🔊 AUDIO
========================= -->
<audio id="chipSound" src="./assets/chip.mp3"></audio>
<audio id="spinButtonSound" src="./assets/spinbutton.mp3"></audio>
<audio id="tableSound" src="./assets/table.mp3"></audio>
<audio id="wheelSound" src="./assets/wheel.mp3"></audio>

<!-- =========================
     📜 SCRIPTS (IMPORTANT ORDER)
========================= -->

<script src="./gameEngine.js"></script>
<script src="./game.js"></script>

</body>
</html>
