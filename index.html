<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Safiki Wheel</title>

<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/wheel.css">
<link rel="stylesheet" href="css/responsive.css">

</head>

<body>

<div class="game-container">

    <!-- BALANCE SECTION START -->

    <div class="balance-box">

        <span>Balance</span>

        <h2 id="balanceAmount">$1000.00</h2>

    </div>

    <!-- BALANCE SECTION END -->


    <!-- START: WHEEL SECTION -->

<div class="wheel-wrapper">

    <img
        id="pointer"
        class="pointer-img"
        src="assets/pointer.png"
        alt="Pointer">

    <img
        id="wheel"
        class="wheel-img"
        src="assets/wheel.png"
        alt="Wheel">

    <div class="wheel-center-hub">
        SAFIKI
    </div>

</div>

    <!-- START: SYMBOL BET TABLE -->

<div class="symbol-table">

    <div class="symbol-box" data-symbol="heart">
        <img src="assets/heart.png" alt="">
        <span>Heart</span>
    </div>

    <div class="symbol-box" data-symbol="diamond">
        <img src="assets/diamond.png" alt="">
        <span>Diamond</span>
    </div>

    <div class="symbol-box" data-symbol="club">
        <img src="assets/club.png" alt="">
        <span>Club</span>
    </div>

    <div class="symbol-box" data-symbol="spade">
        <img src="assets/spade.png" alt="">
        <span>Spade</span>
    </div>

    <div class="symbol-box" data-symbol="crown">
        <img src="assets/crown.png" alt="">
        <span>Crown</span>
    </div>

    <div class="symbol-box" data-symbol="flag">
        <img src="assets/flag.png" alt="">
        <span>Flag</span>
    </div>

</div>

<!-- END: SYMBOL BET TABLE -->
    
    <!-- CHIPS SECTION START -->

    <div class="chips-container">

        <div class="chip" data-value="0.10">
            <img src="assets/chip_0.10c.png" alt="">
            <span>$0.10</span>
        </div>

        <div class="chip" data-value="0.20">
            <img src="assets/chip_20c.png" alt="">
            <span>$0.20</span>
        </div>

        <div class="chip" data-value="0.50">
            <img src="assets/chip_50c.png" alt="">
            <span>$0.50</span>
        </div>

        <div class="chip" data-value="1">
            <img src="assets/chip_1.png" alt="">
            <span>$1</span>
        </div>

        <div class="chip" data-value="2">
            <img src="assets/chip_2.png" alt="">
            <span>$2</span>
        </div>

        <div class="chip" data-value="5">
            <img src="assets/chip_5.png" alt="">
            <span>$5</span>
        </div>

    </div>

    <!-- CHIPS SECTION END -->


    <!-- SPIN BUTTON SECTION START -->

    <div class="spin-section">

        <button id="spinBtn">
            SPIN
        </button>

    </div>

    <!-- SPIN BUTTON SECTION END -->

</div>

<script src="js/script.js"></script>
<script src="js/wheel-engine.js"></script>
<script src="js/bet-engine.js"></script>
<script src="js/bonus-engine.js"></script>
<script src="js/ui-manager.js"></script>

</body>
</html>
