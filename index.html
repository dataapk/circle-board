<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Circle Board Game</title>

<link rel="stylesheet" href="wheel.css">
</head>

<body>

<div class="game-container">

    <!-- ========================
         💰 BALANCE SECTION
    ========================== -->
   <div class="balance-box">
        <span>Balance</span>
        <h2 id="balanceAmount">$1000.00</h2>
    </div>

    <!-- ========================
         💰 user id $ total bet
    ========================== -->
    <div class="game-top-bar">

    <div id="player-id">
        ID: 32658425
    </div>

    <div id="total-bet-display">
        Total Bet: $0
    </div>

    <!-- =========================
         🎰 WHEEL SECTION
    ========================== -->
<div class="wheel-wrapper">

    <img id="pointer" class="pointer-img" src="assets/pointer.png" alt="Pointer">

    <img id="wheel" class="wheel-img" src="assets/wheel.png" alt="Wheel">

    <div id="bubbleTrailLayer" class="bubble-trail-layer"></div>

    <div id="bonusBubbleLayer" class="bonus-overlay"></div>

    <div id="landingMultiplier" class="landing-multiplier"></div>

</div>

<!-- =========================
     🎯 SYMBOL BET TABLE
========================= -->
<div class="symbol-table">

    <div class="symbol-box" data-symbol="heart">
        <img src="assets/heart.png" alt="">
        <span>Heart</span>
        <div class="bet-amount"></div>
    </div>

    <div class="symbol-box" data-symbol="diamond">
        <img src="assets/diamond.png" alt="">
        <span>Diamond</span>
        <div class="bet-amount"></div>
    </div>

    <div class="symbol-box" data-symbol="club">
        <img src="assets/club.png" alt="">
        <span>Club</span>
        <div class="bet-amount"></div>
    </div>

    <div class="symbol-box" data-symbol="spade">
        <img src="assets/spade.png" alt="">
        <span>Spade</span>
        <div class="bet-amount"></div>
    </div>

    <div class="symbol-box" data-symbol="crown">
        <img src="assets/crown.png" alt="">
        <span>Crown</span>
        <div class="bet-amount"></div>
    </div>

    <div class="symbol-box" data-symbol="flag">
        <img src="assets/flag.png" alt="">
        <span>Flag</span>
        <div class="bet-amount"></div>
    </div>

</div>

<!-- =========================
     🎮 SPIN BUTTON
========================= -->
<div class="spin-section">
    <button id="spinBtn">

    <div class="wheel-icon"></div>

    <span class="btn-text">SPIN</span>

</button>
</div>

<!-- =========================
     🪙 CHIPS SECTION (PRO iGaming)
========================= -->


<!-- =========================
     🎮 BET TOOLBAR
========================= -->
<div class="bet-toolbar">

    <!-- MENU (independent) -->
    <div class="menu-holder">

        <button
            id="menuBtn"
            class="tool-icon"
            title="Menu"
        >
            ☰
        </button>

    </div>

    <!-- CENTER GROUP -->
    <div class="bet-center-group">

        <button
            id="undoBtn"
            class="tool-icon"
            title="Undo"
        >
            ↶
        </button>

    <div class="chips-wrapper">

        <div class="chips-container">

            <div class="chip default-chip" data-value="0.10">
                <img src="assets/chip_0.10c.png" alt="">
                <span>$0.10</span>
            </div>

            <div class="chip" data-value="0.20">
                <img src="assets/chip_20c.png" alt="">
                <span>$0.20</span>
            </div>

            <div class="chip" data-value="0.50">
                <img src="assets/chip_50c.png" alt="">
                <span>$0.50</span>
            </div>

            <div class="chip" data-value="1">
                <img src="assets/chip_1.png" alt="">
                <span>$1</span>
            </div>

            <div class="chip" data-value="2">
                <img src="assets/chip_2.png" alt="">
                <span>$2</span>
            </div>

            <div class="chip" data-value="5">
                <img src="assets/chip_5.png" alt="">
                <span>$5</span>
            </div>

        </div>

    </div>

    <button
        id="rebetBtn"
        class="tool-icon"
        title="Rebet"
    >
        ⟳
    </button>

 </div> <!-- bet-center-group -->

</div> <!-- bet
<!-- =========================
     MENU MODAL
========================= -->
<div id="menuModal" class="menu-modal">

    <div class="menu-box">

        <div class="menu-header">

            <span>MENU</span>

            <button id="closeMenuBtn">✖</button>

        </div>

        <div class="menu-grid">

            <div class="menu-card">
                <div class="icon">⚙️</div>
                <span>Settings</span>
            </div>

            <div class="menu-card">
                <div class="icon">📜</div>
                <span>History</span>
            </div>

            <div class="menu-card">
                <div class="icon">🎯</div>
                <span>How To Play</span>
            </div>

        </div>

    </div>

</div>
    
<!-- =========================
     📜 SCRIPTS
========================== -->

<audio id="chipSound" src="assets/chip.mp3"></audio>
<audio id="spinSound" src="assets/spin.mp3"></audio>
<audio id="tableSound" src="assets/table.mp3"></audio>
<audio id="spinButtonSound" src="assets/spinbutton.mp3"></audio>
<audio id="bubbleFlySound" src="assets/bubblebox.mp3"></audio>
<audio id="bubblebrustsound" src="assets/bubblebrust.mp3"></audio>
<audio id="bubbleLandSound" src="assets/bubble.mp3"></audio>
<audio id="bubbleWinSound" src="assets/bubblewin.mp3"></audio>
<script src="./gameEngine.js"></script>
<script src="./game.js"></script>

</body>
</html>
